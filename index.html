<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Practical Work for Meaningful Biology Learning</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f3f7f5;color:#17342e;font-family:system-ui,sans-serif}
    .hero{background:#fff;border-bottom:1px solid #dbe6e0}
    .header{width:min(1480px,94%);margin:auto;padding:clamp(16px,2.5vw,30px) 0;display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(12px,4vw,56px);align-items:center}
    .header p{margin:0 0 8px;font-weight:750;color:#225e50}
    h1{margin:0;font-size:clamp(1.65rem,3.2vw,3rem);line-height:1.08;max-width:26ch;text-wrap:balance}
    .art{display:block;width:100%;height:clamp(90px,13vw,155px);object-fit:contain}
    main{width:min(1480px,94%);margin:24px auto 48px}
    h2{margin:0 0 16px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    article{background:white;border:1px solid #ccded5;border-radius:16px;overflow:hidden;box-shadow:0 5px 14px #123b3410;scroll-margin-top:16px}
    article img{display:block;width:100%;height:auto}
    .body{padding:16px}
    h3{margin:0 0 10px;font-size:1.1rem;line-height:1.3}
    .station-num{color:#225e50;margin-right:6px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    button,a{display:inline-flex;align-items:center;min-height:44px;font:inherit;font-weight:650;color:#174a3c;background:#e7f5ed;border:1px solid #b6d4c5;border-radius:9px;padding:8px 12px;cursor:pointer;text-decoration:none}
    button:hover,a:hover{background:#ceeadd}
    :focus-visible{outline:3px solid #177663;outline-offset:2px}
    .player:not(:empty),.status:not(:empty){margin-top:10px}
    audio,video{display:block;width:100%}
    video{max-height:65vh;background:#12231e}
    @media(max-width:700px){
      .header,.grid{grid-template-columns:1fr}
      .header{gap:10px}
      .art{height:84px;object-position:left center}
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="header">
      <div>
        <p>EDUC7152 Teaching &amp; Learning of Biology</p>
        <h1>Practical Work for Meaningful Biology Learning</h1>
      </div>
      <img class="art" src="course-banner.jpg" alt="Innovations in Biology Investigations">
    </div>
  </header>

  <main>
    <h2>Laboratory stations</h2>
    <div id="stations-grid" class="grid"></div>
  </main>

  <script>
    const STATIONS = [
      "Station 01",
      "Station 02",
      "Station 03",
      "Station 04",
      "Station 05",
      "Station 06",
      "Station 07",
      "Station 08",
      "Station 09",
      "Station 10",
      "Station 11",
      "Station 12",
      "Station 13",
      "Station 14",
      "Station 15",
      "Station 16"
    ];

    const grid = document.getElementById("stations-grid");
    STATIONS.forEach((title, idx) => {
      const n = idx + 1;
      const padded = String(n).padStart(2, "0");
      const slideNum = n + 1; // Slide2.jpg for Station 1 up to Slide17.jpg for Station 16
      const loading = n <= 2 ? "eager" : "lazy";

      const article = document.createElement("article");
      article.id = `station-${n}`;
      article.dataset.station = String(n);
      article.innerHTML = `
        <img src="Slide${slideNum}.jpg" alt="${title} banner" loading="${loading}">
        <div class="body">
          <h3><span class="station-num">${padded}</span> ${title}</h3>
          <div class="actions">
            <button type="button" aria-label="Play ${title} audio">Audio</button>
            <button type="button" aria-label="Play ${title} video">Video</button>
            <a href="protocol${n}.pdf" type="application/pdf" target="_blank" rel="noopener">Protocol PDF</a>
          </div>
          <div class="player"></div>
          <div class="status" role="status"></div>
        </div>
      `;
      grid.appendChild(article);
    });

    let active;
    for (const card of document.querySelectorAll("article")) {
      const i = card.dataset.station;
      const player = card.querySelector(".player");
      const status = card.querySelector(".status");

      function play(files, k = 0) {
        if (active) {
          active.m.pause();
          active.m.remove();
          active.status.textContent = "";
        }
        const isVideo = /\.(mp4|mov|webm)$/i.test(files[k]);
        const m = document.createElement(isVideo ? "video" : "audio");
        m.controls = true;
        m.setAttribute("playsinline", "");
        m.src = files[k];
        active = { m, status };
        player.replaceChildren(m);

        m.addEventListener("error", () => {
          if (active.m !== m) return;
          if (k + 1 < files.length) {
            play(files, k + 1);
          } else {
            status.textContent = "Media could not be loaded. Check the filename and folder.";
          }
        }, { once: true });

        m.play().catch(e => {
          if (active.m === m && e.name === "NotAllowedError") {
            status.textContent = "Tap Play in the media controls to start.";
          }
        });
      }

      const [a, v] = card.querySelectorAll("button");
      a.onclick = () => play([`audio${i}.MP3`, `audio${i}.mp3`]);
      v.onclick = () => {
        const list = [`Video${i}.MP4`, `Video${i}.mp4`];
        if (i === "16") list.push("Video16.MP3", "Video16.mp3");
        play(list);
      };
    }
  </script>
</body>
</html>
